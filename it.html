<section id="audit" class="py-24 px-6 max-w-4xl mx-auto border-t border-brand-border">
            <div class="bg-brand-card rounded-3xl p-8 sm:p-12 border border-brand-accent/30 relative overflow-hidden">
                <div class="max-w-xl mb-10">
                    <span class="text-xs font-mono text-brand-accent uppercase tracking-widest block mb-2">Engagement Diretto</span>
                    <h2 class="font-serif text-3xl sm:text-5xl text-brand-textPrimary mb-4">Richiesta di Audit Riservato</h2>
                    <p class="text-xs sm:text-sm text-brand-textMuted">
                        Invia i tuoi dati per ricevere una revisione confidenziale dell'impronta narrativa in inglese e dell'indice di scoperta AI della tua struttura.
                    </p>
                </div>

                <form action="https://formspree.io/f/maeqavdq" method="POST" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-mono uppercase text-brand-textMuted mb-2">Nome e Cognome / Ruolo</label>
                            <input type="text" name="name" required placeholder="es. Gianluca Rossi, General Manager" class="w-full bg-brand-bg border border-brand-border rounded-xl px-4 py-3 text-sm text-brand-textPrimary placeholder:text-brand-textMuted/40 gold-border-glow">
                        </div>
                        <div>
                            <label class="block text-xs font-mono uppercase text-brand-textMuted mb-2">Nome della Struttura</label>
                            <input type="text" name="property" required placeholder="Nome Ufficiale della Proprietà" class="w-full bg-brand-bg border border-brand-border rounded-xl px-4 py-3 text-sm text-brand-textPrimary placeholder:text-brand-textMuted/40 gold-border-glow">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-mono uppercase text-brand-textMuted mb-2">Regione / Località</label>
                            <select name="region" class="w-full bg-brand-bg border border-brand-border rounded-xl px-4 py-3 text-sm text-brand-textPrimary gold-border-glow">
                                <option>Lago di Como</option>
                                <option>Toscana</option>
                                <option>Costiera Amalfitana</option>
                                <option>Sardegna</option>
                                <option>Altra Tenuta Internazionale</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-mono uppercase text-brand-textMuted mb-2">Sito Web (URL)</label>
                            <input type="url" name="_replyto" required placeholder="https://vostrahotel.it" class="w-full bg-brand-bg border border-brand-border rounded-xl px-4 py-3 text-sm text-brand-textPrimary placeholder:text-brand-textMuted/40 gold-border-glow">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-mono uppercase text-brand-textMuted mb-2">Obiettivi Principali</label>
                        <textarea name="message" rows="3" placeholder="Descrivi le tue sfide di posizionamento..." class="w-full bg-brand-bg border border-brand-border rounded-xl p-4 text-sm text-brand-textPrimary placeholder:text-brand-textMuted/40 gold-border-glow"></textarea>
                    </div>

                    <button type="submit" class="w-full py-4 rounded-full bg-brand-accent text-brand-bg font-semibold text-xs tracking-widest uppercase hover:bg-brand-accentHover transition-all shadow-xl flex items-center justify-center gap-2">
                        <span>Invia Richiesta di Audit</span>
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </section>
