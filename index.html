<!-- Section: Interactive Audit Request Form -->
        <section id="audit" class="py-24 px-6 max-w-4xl mx-auto border-t border-brand-border">
            <div class="bg-brand-card rounded-3xl p-8 sm:p-12 border border-brand-accent/30 relative overflow-hidden">
                <div class="max-w-xl mb-10">
                    <span class="text-xs font-mono text-brand-accent uppercase tracking-widest block mb-2">Direct Engagement</span>
                    <h2 class="font-serif text-3xl sm:text-5xl text-brand-textPrimary mb-4">Request a Narrative Audit</h2>
                    <p class="text-xs sm:text-sm text-brand-textMuted">

                <form action="https://formspree.io/f/maeqavdq" method="POST" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>

                        </div>
                        <div>
                            <label class="block text-xs font-mono uppercase text-brand-textMuted mb-2">Property Name</label>
                            <input type="text" name="property" required placeholder="Official Property Name" class="w-full bg-brand-bg border border-brand-border rounded-xl px-4 py-3 text-sm text-brand-textPrimary placeholder:text-brand-textMuted/40 gold-border-glow">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-mono uppercase text-brand-textMuted mb-2">Region / Location</label>
                            <select name="region" class="w-full bg-brand-bg border border-brand-border rounded-xl px-4 py-3 text-sm text-brand-textPrimary gold-border-glow">
                                <option>Lake Como</option>
                                <option>Tuscany</option>
                                <option>Amalfi Coast</option>
                                <option>Sardinia</option>
                                <option>Other International Asset</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-mono uppercase text-brand-textMuted mb-2">Website URL</label>
                            <input type="url" name="_replyto" required placeholder="https://yourhotel.com" class="w-full bg-brand-bg border border-brand-border rounded-xl px-4 py-3 text-sm text-brand-textPrimary placeholder:text-brand-textMuted/40 gold-border-glow">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-mono uppercase text-brand-textMuted mb-2">Target Objectives</label>
                        <textarea name="message" rows="3" placeholder="Describe your positioning challenges..." class="w-full bg-brand-bg border border-brand-border rounded-xl p-4 text-sm text-brand-textPrimary placeholder:text-brand-textMuted/40 gold-border-glow"></textarea>
                    </div>

                    <button type="submit" class="w-full py-4 rounded-full bg-brand-accent text-brand-bg font-semibold text-xs tracking-widest uppercase hover:bg-brand-accentHover transition-all shadow-xl flex items-center justify-center gap-2">
                        <span>Submit Confidential Audit Request</span>
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </section>
